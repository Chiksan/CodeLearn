version: "3.9"

services:
  # ─── База данных ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: codelearn
      POSTGRES_PASSWORD: codelearn_pass
      POSTGRES_DB: codelearn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelearn -d codelearn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Кэш и очередь задач ──────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Бэкенд FastAPI ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://codelearn:codelearn_pass@db:5432/codelearn_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: "твой@gmail.com"
      SMTP_PASSWORD: "пароль_приложения"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Фронтенд React ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  # ─── Sandbox для выполнения кода (изолированно) ───────
  sandbox:
    image: python:3.12-slim
    restart: always
    volumes:
      - ./docker/sandbox_runner.py:/runner.py
    command: python /runner.py
    mem_limit: 128m
    cpus: 0.5
    network_mode: none   # без доступа к сети — безопасность

volumes:
  postgres_data:
