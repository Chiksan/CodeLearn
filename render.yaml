databases:
  - name: codelearn-db
    databaseName: codelearn_db
    user: codelearn
    plan: free

services:
  - type: web
    name: codelearn-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codelearn-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: akbarismailov2016@gmail.com
      - key: SMTP_PASSWORD
        value: asahclczkjynppel
      - key: REDIS_URL
        value: ""

  - type: web
    name: codelearn-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: codelearn-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
